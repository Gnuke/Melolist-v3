spring:
  application:
    name: melolist-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Supabase 무료 티어 session pooler 서버 커넥션 한도 15 — Hikari 기본(10/10)이면
      # 로컬 개발 서버 + 배포 중 신구 인스턴스가 한도를 소진해 새 인스턴스가 기동
      # 실패한다(07-20 배포 exit 1 실증). 5+5+5=15로 전 환경 동시 기동을 보장.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
  jpa:
    hibernate:
      # 스키마는 Supabase 마이그레이션으로 관리 → 앱은 검증만
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      # 검색 오디오 업로드 상한(F1 크기 검증의 서버측 방어선) — 초과 시 400 표준 바디
      max-file-size: 10MB
      max-request-size: 12MB
  ai:
    openai:
      # 키는 서버 env 전용(.env 미추적) — 커밋 금지(원칙 IV). ai-mock 프로파일에선 실호출 없음.
      # 기본값이 빈 문자열이면 자동설정이 부팅을 거부한다 — ACRCloud 키와 동일하게
      # "키 없이도 부팅, 실호출 시점에 실패(502)" 동작이 되도록 더미를 둔다.
      api-key: ${OPENAI_API_KEY:dummy-key-not-set}
      chat:
        options:
          model: ${AI_MODEL:gpt-5-mini}
          # gpt-5 계열(reasoning)은 temperature 기본값(1)만 허용 — Spring AI 기본 0.7이 실리면 400
          temperature: 1.0
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase JWT Signing Keys(비대칭)의 JWKS 엔드포인트.
          # 예: https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
          jwk-set-uri: ${SUPABASE_JWKS_URI:}
          # Supabase 서명 키는 ES256(ECC) — Spring 기본값(RS256)만으로는 검증 실패
          jws-algorithms: ES256,RS256

server:
  port: ${PORT:8080}

# --- Melolist 커스텀 설정 ---
melolist:
  cors:
    # 프론트(React) 오리진. 콤마로 여러 개.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://melolist-v3.vercel.app,http://localhost:5173}
  acrcloud:
    # 지문/허밍 프로젝트 리전·호스트 동일(ap-southeast-1) 확인됨(2026-07-09 키 발급)
    identify-host: ${ACRCLOUD_HOST:identify-ap-southeast-1.acrcloud.com}
    metadata-host: eu-api-v2.acrcloud.com
    identify-timeout-ms: 10000
    # §5.3: 타임아웃 시 videoId까지 잃어 듣기 버튼·ytimg 폴백이 모두 사라진다 —
    # 실측 정상 조회 2.4~3.6s 분포라 4s로 커버하되, KR2(p95≤6s) 예산 안(acr ~1.5s + meta 4s)
    metadata-timeout-ms: 4000
    fingerprint:
      access-key: ${FINGERPRINT_API_KEY:}
      access-secret: ${FINGERPRINT_API_SECRET:}
      metadata-token: ${METADATA_API_KEY_MUSIC:}
    humming:
      access-key: ${HUMMING_API_KEY:}
      access-secret: ${HUMMING_API_SECRET:}
      metadata-token: ${METADATA_API_KEY_HUMMING:}
    mock:
      # acr-mock 프로파일 전용 — ACRCloud 실호출 없이 파이프라인 테스트.
      # 활성화: SPRING_PROFILES_ACTIVE=acr-mock · 시나리오: hit | nomatch | lowscore | error
      scenario: ${ACR_MOCK_SCENARIO:hit}
  ai:
    # AI 자연어 폴백 검색(spec 002). LLM 호출 컷 10s — meta 4s와 합쳐 프론트 15s 예산 안(SC-003)
    timeout-ms: 10000
    # gpt-5 계열 전용 — 곡 식별은 지식 인출이라 추론 최소화(지연 절감). 비reasoning 모델로
    # 교체 시 AI_REASONING_EFFORT=none 으로 옵션 자체를 끈다.
    reasoning-effort: ${AI_REASONING_EFFORT:minimal}
    quota:
      # 일일 한도(Asia/Seoul 자정 리셋) — 게스트=세션, 로그인=계정 기준. event_log 카운트로 판정
      guest-daily: ${AI_QUOTA_GUEST_DAILY:3}
      user-daily: ${AI_QUOTA_USER_DAILY:10}
    mock:
      # ai-mock 프로파일 전용 — OpenAI 실호출 없이 폴백 흐름 E2E.
      # 활성화: SPRING_PROFILES_ACTIVE=acr-mock,ai-mock · 시나리오: hit | empty | error | slow
      scenario: ${AI_MOCK_SCENARIO:hit}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
