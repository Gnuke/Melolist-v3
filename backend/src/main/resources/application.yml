spring:
  application:
    name: melolist-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # 스키마는 Supabase 마이그레이션으로 관리 → 앱은 검증만
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Supabase JWT Signing Keys(비대칭)의 JWKS 엔드포인트.
          # 예: https://<project-ref>.supabase.co/auth/v1/.well-known/jwks.json
          jwk-set-uri: ${SUPABASE_JWKS_URI:}

server:
  port: ${PORT:8080}

# --- Melolist 커스텀 설정 ---
melolist:
  cors:
    # 프론트(React) 오리진. 콤마로 여러 개.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
